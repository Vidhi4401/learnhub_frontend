<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Materials — LearnHub</title>
    <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/student-materials.css">
  <link rel="stylesheet" href="css/portal-student.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>

  <div id="sidebar" class="sidebar"></div>

  <div class="main-content">
    <div id="navbar" class="navbar"></div>

    <main class="page-content">
      <section class="page-header">
        <h1>Study Materials</h1>
        <p>Notes and resources uploaded by your teachers.</p>
      </section>

      <div class="filter-bar">
        <label>Filter by Course:</label>
        <select id="courseFilter" onchange="filterMaterials()">
          <option value="all">All Enrolled Courses</option>
        </select>
      </div>

      <div id="materialsList">
        <div class="loading-row">Fetching your notes…</div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/theme-manager.js"></script>
  <script src="js/student-layout.js"></script>
  <script>
    
    // token is declared by student-layout.js
    let cachedMaterials   = [];
    let enrolledCourses   = [];

    window.addEventListener("load", () => setTimeout(init, 100));

    async function init() {
      if (!token) { window.location.href = "../auth.html"; return; }
      await loadEnrolledCourses();
      await fetchAllMaterials();
    }

    async function loadEnrolledCourses() {
      try {
        const [coursesRes, enrollRes] = await Promise.all([
          fetch(`${API}/student/courses`,     { headers: { Authorization: "Bearer " + token } }),
          fetch(`${API}/student/enrollments`, { headers: { Authorization: "Bearer " + token } })
        ]);
        const allCourses  = await coursesRes.json();
        const enrollments = await enrollRes.json();
        const enrolledIds = new Set(enrollments.map(e => e.course_id));
        enrolledCourses   = allCourses.filter(c => enrolledIds.has(c.id));

        const sel = document.getElementById("courseFilter");
        sel.innerHTML = '<option value="all">All Enrolled Courses</option>';
        enrolledCourses.forEach(c => {
          const opt = document.createElement("option");
          opt.value      = c.id;
          opt.textContent = c.title;
          sel.appendChild(opt);
        });
      } catch(e) { console.error("Courses load error", e); }
    }

    async function fetchAllMaterials() {
      const container = document.getElementById("materialsList");
      try {
        if (!enrolledCourses.length) {
          container.innerHTML = '<div class="empty-row"><h3>Not enrolled yet</h3><p>Enroll in a course to access its materials.</p></div>';
          return;
        }
        const results = await Promise.all(
          enrolledCourses.map(async c => {
            try {
              const r    = await fetch(`${API}/materials/course/${c.id}`,
                                      { headers: { Authorization: "Bearer " + token } });
              if (!r.ok) return [];
              const mats = await r.json();
              return mats.map(m => ({ ...m, courseName: c.title }));
            } catch { return []; }
          })
        );
        cachedMaterials = results.flat();
        renderMaterials(cachedMaterials);
      } catch(e) {
        container.innerHTML = '<div class="empty-row">Could not connect to server.</div>';
      }
    }

    function renderMaterials(list) {
      const container = document.getElementById("materialsList");
      const filterVal = document.getElementById("courseFilter").value;

      if (!list || !list.length) {
        if (filterVal !== "all") {
          container.innerHTML = `
            <div class="empty-row">
              <h3>📚 No Materials Yet</h3>
              <p>Your teacher hasn't uploaded materials for this course yet. Check back later!</p>
            </div>`;
        } else {
          container.innerHTML = `
            <div class="empty-row">
              <h3>📚 No Materials Yet</h3>
              <p>Your teachers haven't uploaded any study materials yet.</p>
            </div>`;
        }
        return;
      }

      container.innerHTML = list.map(m => `
        <div class="material-card">
          <div style="display:flex; align-items:center;">
            <div class="mat-icon">${getFileIcon(m.file_url)}</div>
            <div class="mat-info">
              <div class="mat-title">${m.title}</div>
              <span class="mat-course">${m.courseName}</span>
            </div>
          </div>
          <div class="mat-actions">
            <button onclick="viewMaterial('${m.file_url}')" class="mat-view-btn">👁 View</button>
            <button onclick="downloadMaterial('${m.file_url}', '${m.title}')" class="mat-view-btn download">📥 Download</button>
          </div>
        </div>
      `).join("");
    }

    function getFileExtension(url) {
      if (!url) return "pdf";
      const parts = url.split('?')[0].split('/');
      const lastPart = parts[parts.length - 1];
      if (lastPart.includes('.')) {
        return lastPart.split('.').pop();
      }
      return "pdf";
    }

    function getMimeType(url) {
      const ext = getFileExtension(url).toLowerCase();
      if (ext === "pdf")  return "application/pdf";
      if (ext === "txt")  return "text/plain";
      if (ext === "doc")  return "application/msword";
      if (ext === "docx") return "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
      return "application/octet-stream";
    }

    async function downloadMaterial(url, title) {
      if (!url) return;
      const ext = getFileExtension(url);
      const safeTitle = (title || "Document").replace(/[^a-z0-9]/gi, '_');
      const filename = `${safeTitle}.${ext}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Download failed");
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        console.error("Download error", e);
        // Fallback for CORS issues
        window.open(url, "_blank");
      }
    }

    async function viewMaterial(url) {
      if (!url) return;
      
      if (url.includes("cloudinary.com") && url.includes("/raw/upload/")) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const blob = await res.blob();
            const mime = getMimeType(url);
            const newBlob = new Blob([blob], { type: mime });
            const blobUrl = URL.createObjectURL(newBlob);
            window.open(blobUrl, "_blank");
            return;
          }
        } catch (e) {
          console.warn("Blob view failed", e);
        }
        window.open(url, "_blank");
        return;
      }

      if (url.includes("cloudinary.com")) {
        const viewUrl = url.replace("/upload/", "/upload/fl_inline/");
        window.open(viewUrl, "_blank");
        return;
      }

      window.open(getFileUrl(url), "_blank");
    }

    function getFileUrl(path) {
      if (!path) return "#";
      if (path.startsWith("http")) return path;
      return `${BASE_URL}/${path}`;
    }

    function filterMaterials() {
      const val = document.getElementById("courseFilter").value;
      const filtered = val === "all"
        ? cachedMaterials
        : cachedMaterials.filter(m => String(m.course_id) === String(val));
      renderMaterials(filtered);
    }

    function getFileIcon(url) {
      if (!url) return "📄";
      const lower = url.toLowerCase();
      if (lower.includes(".pdf"))                          return "📕";
      if (lower.includes(".doc"))                          return "📝";
      if (lower.includes(".ppt"))                          return "📊";
      if (lower.includes(".xls"))                          return "📈";
      return "📄";
    }
  </script>
  <script src="../js/mobile-toggle.js"></script>
</body>
</html>
