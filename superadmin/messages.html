<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Requests — Super Admin</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../admin/css/main.css">
  <script src="../js/config.js"></script>
  <script src="../js/theme-manager.js"></script>
  <style>
    .table-wrap { overflow-x: auto; }
    .data-table { min-width: 640px; }

    .btn-approve {
      background: #059669; color: white;
      padding: 7px 14px; border: none;
      border-radius: 7px; cursor: pointer;
      font-size: 13px; font-weight: 600;
      transition: background 0.15s;
    }
    .btn-approve:hover { background: #047857; }

    .btn-reject {
      background: #dc2626; color: white;
      padding: 7px 14px; border: none;
      border-radius: 7px; cursor: pointer;
      font-size: 13px; font-weight: 600;
      transition: background 0.15s;
    }
    .btn-reject:hover { background: #b91c1c; }

    .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .empty-row td { text-align: center; padding: 40px; color: var(--muted); }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 12px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9999; display: none; color: #fff;
    }
    .toast.success { background: #059669; }
    .toast.error   { background: #dc2626; }
  </style>
</head>
<body>
  <div id="sidebar" class="sidebar"></div>
  <div class="main-content">
    <div id="navbar" class="navbar"></div>
    <div class="page-content">

      <div style="margin-bottom: 28px;">
        <h1 style="font-size:24px; font-weight:800; color:var(--ink); margin-bottom:6px;">Pending Contact Requests</h1>
        <p style="color:var(--muted); font-size:13px;">Review and approve organization registration requests.</p>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Organization</th>
                <th>Admin Name</th>
                <th>Admin Email</th>
                <th>Submitted</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="requestsBody">
              <tr><td colspan="5" style="text-align:center; padding:30px; color:var(--muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/super-layout.js"></script>
  <script>
    async function loadRequests() {
      try {
        const res = await fetch(`${SUPER_API}/contact-requests`, {
          headers: { Authorization: "Bearer " + token }
        });
        const requests = await res.json();
        const tbody = document.getElementById("requestsBody");

        if (!res.ok) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="5" style="color:#ef4444;">${requests.detail || "Failed to load requests."}</td></tr>`;
          return;
        }

        if (!Array.isArray(requests) || requests.length === 0) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="5">✅ No pending requests</td></tr>`;
          return;
        }

        tbody.innerHTML = requests.map(req => `
          <tr>
            <td style="font-weight:700; color:var(--ink);">${req.org_name}</td>
            <td style="color:var(--ink);">${req.admin_name}</td>
            <td style="color:var(--muted);">${req.admin_email}</td>
            <td style="color:var(--muted); font-size:13px;">${req.created_at ? new Date(req.created_at).toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" }) : "—"}</td>
            <td>
              <div class="action-buttons">
                <button class="btn-approve" onclick="approveRequest(${req.id})">✓ Approve</button>
                <button class="btn-reject"  onclick="rejectRequest(${req.id})">✗ Reject</button>
              </div>
            </td>
          </tr>
        `).join("");
      } catch (e) {
        document.getElementById("requestsBody").innerHTML = `<tr class="empty-row"><td colspan="5" style="color:#ef4444;">Error loading requests.</td></tr>`;
        console.error(e);
      }
    }

    async function approveRequest(id) {
      if (!confirm("Approve this request? This will create the organization and admin account.")) return;
      try {
        const res = await fetch(`${SUPER_API}/approve-contact/${id}`, {
          method: "POST",
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message || "Request approved", "success");
          loadRequests();
        } else {
          showToast(data.detail || "Error approving request", "error");
        }
      } catch (e) {
        showToast("Network error. Please try again.", "error");
      }
    }

    async function rejectRequest(id) {
      if (!confirm("Reject this request?")) return;
      try {
        const res = await fetch(`${SUPER_API}/reject-contact/${id}`, {
          method: "POST",
          headers: { Authorization: "Bearer " + token }
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message || "Request rejected", "success");
          loadRequests();
        } else {
          showToast(data.detail || "Error rejecting request", "error");
        }
      } catch (e) {
        showToast("Network error. Please try again.", "error");
      }
    }

    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast ${type}`;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3500);
    }

    loadRequests();
  </script>
</body>
</html>
