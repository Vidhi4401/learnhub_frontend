<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Admins — Super Admin</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../admin/css/main.css">
  <script src="../js/config.js"></script>
  <script src="../js/theme-manager.js"></script>
  <style>
    /* Modal */
    .modal {
      display: none; position: fixed; z-index: 2000;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
    }
    .modal.open { display: flex; align-items: center; justify-content: center; }
    .modal-box {
      background: var(--white); border-radius: 16px;
      padding: 32px; width: 100%; max-width: 460px;
      margin: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-box h2 { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px; font-family: inherit;
      color: var(--ink); background: var(--input-bg);
      transition: border-color 0.2s; outline: none;
      appearance: none;
    }
    .form-group input:focus,
    .form-group select:focus { border-color: var(--accent, #6366f1); }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .modal-actions button { flex: 1; }

    /* Table responsive */
    .table-wrap { overflow-x: auto; }
    .data-table { min-width: 560px; }

    .status-badge {
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      border-radius: 20px; display: inline-block;
    }
    .status-active   { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #dc2626; }

    .empty-row td { text-align: center; padding: 40px; color: var(--muted); }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #111827; color: #fff;
      padding: 12px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9999; display: none;
    }
  </style>
</head>
<body>
  <div id="sidebar" class="sidebar"></div>
  <div class="main-content">
    <div id="navbar" class="navbar"></div>
    <div class="page-content">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 style="font-size:24px; font-weight:800; color:var(--ink); margin-bottom:4px;">Organization Admins</h1>
          <p style="color:var(--muted); font-size:13px;">All admin accounts across all organizations.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="openModal()">+ Add Admin</button>
          <button class="btn btn-ghost" id="manageAdminBtn">Manage</button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Admin Name</th>
                <th>Email</th>
                <th>Organization</th>
                <th>Status</th>
                <th id="actionHeader" style="display:none;">Action</th>
              </tr>
            </thead>
            <tbody id="adminsList">
              <tr><td colspan="5" style="text-align:center; padding:30px; color:var(--muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Create Admin Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-box">
      <h2>👤 Create Organization Admin</h2>

      <div id="modalError" style="display:none; background:#fee2e2; color:#dc2626; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:16px;"></div>

      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="adminName" placeholder="Full name" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="adminEmail" placeholder="admin@org.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="adminPassword" placeholder="Set a strong password">
      </div>
      <div class="form-group">
        <label>Organization *</label>
        <select id="orgSelect">
          <option value="">— Select organization —</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="saveAdminBtn" onclick="createAdmin()">Create Account</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/super-layout.js"></script>
  <script>
    let manageAdminMode = false;

    document.addEventListener("DOMContentLoaded", () => {
      loadAdmins();
      loadOrgsForSelect();

      document.getElementById("manageAdminBtn").addEventListener("click", function () {
        manageAdminMode = !manageAdminMode;
        this.textContent = manageAdminMode ? "Done" : "Manage";
        this.className = manageAdminMode ? "btn btn-primary" : "btn btn-ghost";
        document.getElementById("actionHeader").style.display = manageAdminMode ? "" : "none";
        loadAdmins();
      });
    });

    async function loadAdmins() {
      try {
        const res = await fetch(`${SUPER_API}/admins`, {
          headers: { Authorization: "Bearer " + token }
        });
        const admins = await res.json();
        const list = document.getElementById("adminsList");

        if (!Array.isArray(admins) || admins.length === 0) {
          list.innerHTML = `<tr class="empty-row"><td colspan="5">No admins found.</td></tr>`;
          return;
        }

        list.innerHTML = admins.map(a => `
          <tr>
            <td style="font-weight:600; color:var(--ink);">${a.name}</td>
            <td style="color:var(--muted);">${a.email}</td>
            <td style="color:var(--accent, #6366f1); font-weight:600;">${a.org_name}</td>
            <td>
              <span class="status-badge ${a.status ? 'status-active' : 'status-inactive'}">
                ${a.status ? "Active" : "Inactive"}
              </span>
            </td>
            ${manageAdminMode ? `<td><button class="btn btn-danger" style="padding:7px 14px; font-size:13px;" onclick="deleteAdmin(${a.id}, '${a.name.replace(/'/g,"\\'")}')">Delete</button></td>` : ""}
          </tr>
        `).join("");
      } catch (e) {
        document.getElementById("adminsList").innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center; padding:30px;">Failed to load admins.</td></tr>`;
        console.error(e);
      }
    }

    async function deleteAdmin(id, name) {
      if (!confirm(`Delete admin "${name}"?`)) return;
      try {
        const res = await fetch(`${SUPER_API}/admins/${id}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token }
        });
        if (res.ok) {
          showToast("Admin deleted");
          loadAdmins();
        } else {
          const d = await res.json();
          alert(d.detail || "Failed to delete admin.");
        }
      } catch (e) {
        alert("Error deleting admin.");
      }
    }

    async function loadOrgsForSelect() {
      try {
        const res = await fetch(`${SUPER_API}/organizations`, {
          headers: { Authorization: "Bearer " + token }
        });
        const orgs = await res.json();
        const select = document.getElementById("orgSelect");
        select.innerHTML = `<option value="">— Select organization —</option>` +
          orgs.map(o => `<option value="${o.id}">${o.name}</option>`).join("");
      } catch (e) { console.error(e); }
    }

    function openModal() {
      document.getElementById("adminModal").classList.add("open");
      document.getElementById("modalError").style.display = "none";
      loadOrgsForSelect();
    }
    function closeModal() {
      document.getElementById("adminModal").classList.remove("open");
      ["adminName","adminEmail","adminPassword"].forEach(id => {
        document.getElementById(id).value = "";
      });
      document.getElementById("orgSelect").value = "";
    }

    async function createAdmin() {
      const name     = document.getElementById("adminName").value.trim();
      const email    = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      const org_id   = document.getElementById("orgSelect").value;
      const btn  = document.getElementById("saveAdminBtn");
      const errEl = document.getElementById("modalError");

      errEl.style.display = "none";

      if (!name || !email || !password || !org_id) {
        errEl.textContent = "All fields are required.";
        errEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating…";
      try {
        const res = await fetch(`${SUPER_API}/admins?org_id=${org_id}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          closeModal();
          showToast("Admin created successfully");
          loadAdmins();
        } else {
          errEl.textContent = data.detail || "Error creating admin.";
          errEl.style.display = "block";
        }
      } catch (e) {
        errEl.textContent = "Network error. Please try again.";
        errEl.style.display = "block";
      }
      btn.disabled = false;
      btn.textContent = "Create Account";
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    document.getElementById("adminModal").addEventListener("click", function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
