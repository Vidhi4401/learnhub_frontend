<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnHub | Super Admin Login</title>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/config.js"></script>
  <script src="../js/theme-manager.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      background: var(--white, #fff);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .badge-top {
      display: inline-block;
      background: #0f172a;
      color: white;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
    }
    .logo-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--ink, #111827);
      display: block;
      margin-bottom: 6px;
    }
    .auth-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted, #6b7280);
      margin-bottom: 1.75rem;
    }
    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: .82rem;
      font-weight: 700;
      color: var(--muted, #6b7280);
      margin-bottom: .4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: .72rem .9rem;
      border-radius: 9px;
      border: 1.5px solid var(--border, #e5e7eb);
      font-size: .97rem;
      font-family: inherit;
      color: var(--ink, #111827);
      background: var(--input-bg, #fff);
      transition: border-color .2s;
      outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }

    .btn-login {
      width: 100%;
      margin-top: 1rem;
      padding: .8rem;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .15s;
      font-family: inherit;
    }
    .btn-login:hover { background: #1e293b; transform: translateY(-1px); }
    .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .alert {
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .88rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: none;
      background: #fee2e2;
      color: #dc2626;
    }
    .footer-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted, #6b7280);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:18px;">
      <span class="badge-top">Global Management</span>
      <span class="logo-text">LearnHub</span>
      <div class="auth-title">Super Admin Access</div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="superadmin@learnhub.com"
             onkeydown="if(event.key==='Enter') login()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') login()">
    </div>

    <button class="btn-login" id="loginBtn" onclick="login()">Enter Portal</button>

    <div class="footer-note">Secure Global Administrative Interface</div>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById("alertBox");
      el.textContent = msg;
      el.style.display = "block";
    }

    async function login() {
      const email = document.getElementById("loginEmail").value.trim();
      const pwd   = document.getElementById("loginPassword").value;
      const btn   = document.getElementById("loginBtn");

      if (!email || !pwd) { showError("Email and password are required."); return; }

      btn.disabled = true;
      btn.textContent = "Authenticating…";
      document.getElementById("alertBox").style.display = "none";

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password: pwd })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || "Access denied.");
          return;
        }
        if (data.role !== "superadmin") {
          showError("Unauthorized. Super Admin access only.");
          return;
        }

        localStorage.setItem("token", data.access_token);
        localStorage.setItem("user", JSON.stringify({
          id:    data.id,
          name:  data.name,
          email: data.email,
          role:  data.role
        }));

        window.location.href = "super-dashboard.html";

      } catch (err) {
        console.error("Login error:", err);
        showError("Cannot connect to server. Check your connection.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Enter Portal";
      }
    }
  </script>
</body>
</html>
