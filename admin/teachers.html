<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Teachers — Admin Portal</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/portal-admin.css">
  <script src="../js/config.js"></script>
  <script src="../js/theme-manager.js"></script>
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>

  <div id="sidebar" class="sidebar"></div>

  <div class="main-content">
    <div id="navbar" class="navbar"></div>

    <main class="page-content">
      <div class="page-header">
        <h1 class="navbar-page-title" style="font-size:24px;">Faculty Management</h1>
        <div class="header-actions">
            <button class="btn btn-secondary-alt" onclick="document.getElementById('bulkImportInput').click()">📤 Bulk Import</button>
            <input type="file" id="bulkImportInput" style="display:none" accept=".csv, .xlsx, .xls" onchange="handleBulkImport(event)">
            <button class="btn btn-primary" onclick="openInviteModal()">+ Invite Teacher</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="table-card fade-up">
        <div class="table-filters">
            <input type="text" id="teacherSearch" class="search search-input-alt" placeholder="Search by name or email..." autocomplete="off">
            <select id="statusFilter" class="filter-select-alt">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Teacher</th>
              <th>Email</th>
              <th>Courses</th>
              <th>Students</th>
              <th>Avg Score</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="teachersTableBody">
            <!-- Dynamic -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- INVITE MODAL -->
  <div id="inviteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header-custom">
            <button class="close-modal-custom" onclick="closeModal('inviteModal')">&times;</button>
            <h3>Invite New Teacher</h3>
            <p>Create a faculty account to manage courses.</p>
        </div>
        <div class="modal-body">
            <div class="form-group-custom">
                <label>Full Name</label>
                <input type="text" id="inviteName" class="form-input-custom" placeholder="e.g. Dr. Emily Smith" autocomplete="off">
            </div>
            <div class="form-group-custom">
                <label>Email Address</label>
                <input type="email" id="inviteEmail" class="form-input-custom" placeholder="teacher@email.com" autocomplete="off">
            </div>
            <div class="form-group-custom">
                <label>Temporary Password</label>
                <div class="pwd-wrap">
                    <input type="password" id="invitePass" class="form-input-custom" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="modal-footer-actions">
                <button class="btn btn-primary btn-full-p-14" onclick="submitInvite()">Create Account</button>
                <button class="btn btn-ghost btn-ghost-full" onclick="closeModal('inviteModal')">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <!-- RESET PASS MODAL -->
  <div id="resetModal" class="modal">
    <div class="modal-content">
        <div class="modal-header-custom modal-header-darker">
            <button class="close-modal-custom" onclick="closeModal('resetModal')">&times;</button>
            <h3>Reset Password</h3>
            <p id="resetTeacherName">Update faculty security credentials.</p>
        </div>
        <div class="modal-body">
            <div class="form-group-custom">
                <label>New Password</label>
                <div class="pwd-wrap">
                    <input type="password" id="newPass" class="form-input-custom" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="form-group-custom">
                <label>Confirm Password</label>
                <div class="pwd-wrap">
                    <input type="password" id="confirmPass" class="form-input-custom" placeholder="••••••••" autocomplete="new-password">
                    <button type="button" class="pwd-eye" onclick="togglePwd(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="modal-footer-actions">
                <button class="btn btn-primary btn-full-p-14 btn-reset-confirm" onclick="submitReset()">Update Password</button>
                <button class="btn btn-ghost btn-ghost-full" onclick="closeModal('resetModal')">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/teachers.js"></script>
  <script src="../js/mobile-toggle.js"></script>
</body>
</html>
